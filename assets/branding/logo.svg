<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#2B65D9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#22853C"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#D99B00"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#B3281E"/>
    </linearGradient>
  </defs>

  <!-- Latar belakang transparan secara default -->

  <!-- Perisai / Shield (Warna Hijau) -->
  <path d="M 50 10 L 82 23 L 82 50 C 82 70 68 85 50 92 C 32 85 18 70 18 50 L 18 23 Z" 
        fill="none" stroke="url(#greenGrad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bodi Kamera (Warna Biru) -->
  <rect x="30" y="38" width="28" height="24" rx="6" fill="url(#blueGrad)" />

  <!-- Lensa Kamera (Warna Kuning) -->
  <path d="M 56 50 L 70 41 C 72 40 75 41 75 44 L 75 56 C 75 59 72 60 70 59 L 56 50 Z" 
        fill="url(#yellowGrad)" />

  <!-- Titik Perekaman (Warna Merah) -->
  <circle cx="39" cy="50" r="4" fill="url(#redGrad)" />
</svg>
