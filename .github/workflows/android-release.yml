name: Android Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - canary
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-serialization
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"

jobs:
  build-apk:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Decode Android Keystore
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "keystore_decoded=true" >> $GITHUB_OUTPUT
          else
            echo "Keystore secret KEYSTORE_BASE64 not found. Proceeding without signing or using local defaults."
            echo "keystore_decoded=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APKs
        run: |
          gradle assembleRelease
          TAG_NAME="${{ github.ref_name }}"
          APK_DIR="app/build/outputs/apk/release"

          if [ -d "$APK_DIR" ]; then
            for f in $APK_DIR/*.apk; do
              if [ -f "$f" ]; then
                base=$(basename "$f")
                arch="universal"
                if [[ "$base" == *"arm64-v8a"* ]]; then arch="arm64-v8a";
                elif [[ "$base" == *"armeabi-v7a"* ]]; then arch="armeabi-v7a";
                elif [[ "$base" == *"x86_64"* ]]; then arch="x86_64";
                elif [[ "$base" == *"x86"* ]]; then arch="x86";
                elif [[ "$base" == *"universal"* ]]; then arch="universal";
                fi
                target_name="camera-background-twinpath-labs-${TAG_NAME}-${arch}-nodpi.apk"
                if [ "$base" != "$target_name" ]; then
                  mv "$f" "$APK_DIR/$target_name"
                fi
              fi
            done
          fi
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_decoded == 'true' && './my-upload-key.jks' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  build-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Decode Android Keystore
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "keystore_decoded=true" >> $GITHUB_OUTPUT
          else
            echo "Keystore secret KEYSTORE_BASE64 not found. Proceeding without signing or using local defaults."
            echo "keystore_decoded=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release AAB
        run: |
          gradle bundleRelease
          TAG_NAME="${{ github.ref_name }}"
          AAB_DIR="app/build/outputs/bundle/release"

          if [ -d "$AAB_DIR" ]; then
            for f in $AAB_DIR/*.aab; do
              if [ -f "$f" ]; then
                base=$(basename "$f")
                target_name="camera-background-twinpath-labs-${TAG_NAME}-universal-nodpi.aab"
                if [ "$base" != "$target_name" ]; then
                  mv "$f" "$AAB_DIR/$target_name"
                fi
              fi
            done
          fi
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_decoded == 'true' && './my-upload-key.jks' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aabs
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 1

  generate-notes:
    name: Generate Release Notes via Gemini
    needs: [build-apk, build-aab]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Diperlukan oleh skrip Gemini changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Release Notes via Gemini API
        run: node .github/scripts/generate_release_notes.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-apk, build-aab, generate-notes]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release

      - name: Download AAB Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-aabs
          path: app/build/outputs/bundle/release

      - name: Download Release Notes Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger GitHub Pages Build (Rebuild API Proxy)
        run: gh workflow run github-pages.yml --ref canary
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
