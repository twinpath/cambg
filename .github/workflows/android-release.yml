name: Android Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - canary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so git logs/tags are available for Gemini notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Decode Android Keystore
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "keystore_decoded=true" >> $GITHUB_OUTPUT
          else
            echo "Keystore secret KEYSTORE_BASE64 not found. Proceeding without signing or using local defaults."
            echo "keystore_decoded=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release Artifacts (APK & AAB)
        run: |
          gradle assembleRelease bundleRelease
          TAG_NAME="${{ github.ref_name }}"
          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"

          if [ -d "$APK_DIR" ]; then
            for f in $APK_DIR/*.apk; do
              if [ -f "$f" ]; then
                base=$(basename "$f")
                arch="universal"
                if [[ "$base" == *"arm64-v8a"* ]]; then arch="arm64-v8a";
                elif [[ "$base" == *"armeabi-v7a"* ]]; then arch="armeabi-v7a";
                elif [[ "$base" == *"x86_64"* ]]; then arch="x86_64";
                elif [[ "$base" == *"x86"* ]]; then arch="x86";
                elif [[ "$base" == *"universal"* ]]; then arch="universal";
                fi
                target_name="camera-background-twinpath-labs-${TAG_NAME}-${arch}-nodpi.apk"
                if [ "$base" != "$target_name" ]; then
                  mv "$f" "$APK_DIR/$target_name"
                fi
              fi
            done
          fi

          if [ -d "$AAB_DIR" ]; then
            for f in $AAB_DIR/*.aab; do
              if [ -f "$f" ]; then
                base=$(basename "$f")
                target_name="camera-background-twinpath-labs-${TAG_NAME}-universal-nodpi.aab"
                if [ "$base" != "$target_name" ]; then
                  mv "$f" "$AAB_DIR/$target_name"
                fi
              fi
            done
          fi
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_decoded == 'true' && './my-upload-key.jks' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Release Notes via Gemini API
        if: startsWith(github.ref, 'refs/tags/')
        run: node .github/scripts/generate_release_notes.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
